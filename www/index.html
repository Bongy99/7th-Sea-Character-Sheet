// post-processing: ogni stregoneria -> poteri singoli con gruppo (g)
const CFG7=[
 [/hexenwerk/,[['Unguenti',null],['Unguenti Maggiori','Unguenti Maggiori',1],['Unguenti Minori','Unguenti Minori',1]]],

 [/khahesh/,[['Ahura','Ahura'],['Arsalan, Angelo degli Animali e del Giudizio','Angeli'],['Eredità Comuni','Eredità Comuni',1],['Eredità Rare','Eredità Rare',1]]],

function post7(k,items){const cl=x=>String(x).replace(/\s+/g," ").replace(/([a-zà-ú])- ([a-zà-ú])/g,"$1$2").trim();
 const rule=CFG7.find(c=>c[0].test(k));const R=rule?rule[1]:[];let g='',res=[];
 for(const i of items){const r=R.find(x=>x[0]===i.n);let drop=false;
  if(r){g=r[1]||'';drop=!r[1]||r[2]}
  const ri=i.r;delete i.r;if(drop)continue;
  if(ri&&!/cavalieri/.test(k)&&!(r&&r[1]))i.g=ri;else if(g)i.g=g;
  if(i.pg&&/^Incanti di /.test(i.pg))i.g=i.pg;if(i.tag)i.n=i.n+' ('+i.tag[0].toUpperCase()+i.tag.slice(1)+')';delete i.pg;delete i.tag;
  if(i.g==='Regole')continue;
  i.d=cl(i.d);
  const sp=(re)=>{const parts=i.d.split(re);if(parts.length<3)return false;i.d=cl(parts[0]);i.subs=[];
   for(let x=1;x<parts.length;x+=2){const body=parts[x+1]||'';const bl=body.split(/\s*•\s*/).map(cl).filter(Boolean);
    i.subs.push({n:parts[x],d:/•/.test(body)?bl.join('\n'):cl(body)})}return true};
  if(/cavalieri/.test(k)&&/^Hildræd/.test(i.n)&&/Hereward/.test(i.d)){
   const mk2=(n,a,b)=>({n,g:i.g,d:i.d,subs:[{n:'Tratto Maggiore',d:a},{n:'Tratto Minore',d:b}]});
   res.push(mk2('Hereward il Consigliere','Acume','Panache'));res.push(mk2('Hildræd la Comandante','Grazia','Vigore'));continue}
  if(/galdr/.test(k))sp(/\b(Stort Merke|Litet Merke):?\s*/);
  else if(/sanderis|melbur/.test(k)){if(!sp(/\b(Favori Maggiori|Favori Minori):\s*/))continue}
  else if(/sorte/.test(k))sp(/\b(Maggiore|Minore):\s*/);
  res.push(i)}
 return res}
function mkParser7(){
 const out={bg:[],adv:[],arc:[],nat:{},lists:{}};
 const SK=['Allettare','Arte della Guerra','Atletica','Cavalcare','Convincere','Empatia','Esibirsi','Furto','Intimidire','Istruzione','Mira','Mischia','Nascondersi','Navigazione','Notare','Rissa'];
 const SKN=new Set(SK.map(s=>s.toLowerCase()));
 const cl=s=>String(s).replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
 const SMALL=new Set('di del della delle dei degli dello da dal dai dalla la il lo le gli e se per con ai al alle alla sui sul sulla in a un una uno ma o nel nella du des de et'.split(' '));
 const cap=str=>{const w=cl(str).toLowerCase().split(' ');return w.map((x,i)=>{
   const m=x.match(/^([dlsn]?[a-z]{0,3}[’'])(.+)$/i);
   const cw=y=>y.replace(/(^|[(\-\/])(\p{L})/gu,(q,a,b)=>a+b.toUpperCase());
   if(m&&/^(dell|all|nell|sull|dall|l|d|un|c|quest)[’']$/i.test(m[1]))return (i?m[1]:m[1].replace(/^./,c=>c.toUpperCase()))+cw(m[2]);
   if(i&&SMALL.has(x))return x;return cw(x)}).join(' ')};
 const cn=s=>cl(s).replace(/\bSE\b/g,'se');
 const isUp=s=>/[A-ZÀ-Ú]/.test(s)&&s===s.toUpperCase();
 let mode='',bgNat='',cost=0,cur=null,blk=null,sec=null,ent=null,pend=null,hy=false,lastH2='',lastH1='',lastCol=-1,natT=null,arcMode=null,arcC=null,stil=null;
 const addT=(o,k,l)=>{const t=l.txt;if(!t)return;const p=o[k]||'';o[k]=(o['_h'+k]?p:(p?p+' ':''))+t;o['_h'+k]=!!l.hy};
 let PT=[],secG='',grpN='',pendStyle=null,lastH2Nat=false;
 function finNat(){if(!natT)return;const it=natT.it,pl=it.filter(x=>/^\+/.test(x.s)),mx=pl.length?Math.min(...pl.map(x=>x.x)):1e9;
  const bon=it.filter(x=>/^\+/.test(x.s)||x.x>=mx-8).sort((a,b)=>b.y-a.y),nm=it.filter(x=>!/^\+/.test(x.s)&&x.x<mx-8);
  const rr=[];bon.forEach(b=>{if(/^\+/.test(b.s)||!rr.length)rr.push({y:b.y,b:b.s});else rr[rr.length-1].b+=' '+b.s});
  nm.forEach(n=>{let best=null,bd=1e9;rr.forEach(r=>{const d=Math.abs(r.y-n.y);if(d<bd){bd=d;best=r}});if(best)(best.n=best.n||[]).push(n)});
  rr.forEach(r=>{const z=cl((r.n||[]).sort((a,b)=>b.y-a.y).map(x=>x.s).join(' '));if(z)out.nat[z]=cl(r.b)});natT=null}
 function build(items){
  PT=items.filter(t=>t.str!==undefined&&/^(MINORE|MAGGIORE)$/.test(t.str.trim()));
  const its=items.filter(t=>t.str!==undefined&&t.str.trim()&&t.y>34&&t.h>=8&&!/Riccardo Milone|^ç$/.test(t.str.trim()));
  const L=[];
  const cols=[its.filter(t=>t.x<305),its.filter(t=>t.x>=305)];
  cols.forEach((c,ci)=>{c.sort((a,b)=>b.y-a.y||a.x-b.x);const ls=[];
   for(const t of c){const l=ls[ls.length-1];if(l&&Math.abs(l.y-t.y)<=2.6)l.i.push(t);else ls.push({y:t.y,i:[t],col:ci})}
   for(const l of ls){l.i.sort((a,b)=>a.x-b.x);let it=l.i;l.hy=false;
    if(it.length>1&&it[it.length-1].str.trim()=='-'){l.hy=true;it=it.slice(0,-1);l.i=it}
    l.txt=cl(it.map(t=>t.str.trim()).join(' '));l.b=it.every(t=>t.b);l.h=Math.max(...it.map(t=>t.h));l.x=it[0].x;l.f=it[0].f;l.fl=it.map(t=>t.f).join(' ')
    L.push(l)}});
  return L}
 const isH18=l=>l.b&&l.h>=17&&!isUp(l.txt)&&/Calluna/i.test(l.f);
 const isSide=l=>l.h>=17&&isUp(l.txt);
 const isH14=l=>l.h>=13.5&&l.h<=14.6&&/Calluna/i.test(l.f);
 const isName=l=>l.b&&l.h>=9.5&&l.h<=10.8&&isUp(l.txt.replace(/[()0-9,–-]/g,''))&&/Calluna/i.test(l.f);
 const isH12=l=>l.h>=11.5&&l.h<=12.6&&/Calluna/i.test(l.f)&&!l.b;
 const isIt=l=>/Italic|-It$/i.test(l.f)&&l.h>=10.8&&l.h<=11.6&&/Calluna/i.test(l.f);
 function finBlk(){if(!blk||!cur){blk=null;return}
  const vl=blk.items.filter(t=>t.x<blk.cx);
  const grp=(arr)=>{const ys=[...new Set(arr.map(t=>Math.round(t.y)))].sort((a,b)=>b-a);const r=[];let last=null;
   for(const y of ys){const s=cl(arr.filter(t=>Math.round(t.y)==y).sort((a,b)=>a.x-b.x).map(t=>t.str.trim()).join(' '));if(!s||/si trova in/.test(s))continue;r.push({y,s})}return r};
  const V=[],A=[];
  grp(vl).forEach(l=>{const p=V[V.length-1];if(p&&(p.s.split('(').length>p.s.split(')').length||/^\(|^[a-zà-ú]/.test(l.s)&&!SKN.has(l.s.toLowerCase())))p.s=cl(p.s+' '+l.s);else V.push({s:l.s})});
  grp(blk.items.filter(t=>t.x>=blk.cx)).forEach(l=>{const p=A[A.length-1];if(p&&!SKN.has(p.s.toLowerCase())&&SKN.has(cl(p.s+' '+l.s).toLowerCase()))p.s=cl(p.s+' '+l.s);else A.push({s:l.s})});
  cur.vant=V.map(x=>x.s).filter(s=>s&&!/^(Vantaggi|Abilità)$/i.test(s));cur.abil=A.map(x=>x.s).filter(s=>s&&!/^(Vantaggi|Abilità)$/i.test(s));blk=null}
 function finAdv(){if(ent&&mode!=='sec'&&mode!=='stil'){ent.d=cl(ent.d);delete ent._hd;if(ent.d)out.adv.push(ent)}if(mode==='adv'||mode==='adv0')ent=null}
 const TRT=/^(Vigore|Grazia|Risolutezza|Acume|Panache)$/;
 function mkEnt(t,l){const x0=l.i[0].x;const tg=PT.find(p=>Math.abs(p.y-l.y)<=5&&p.x>x0&&p.x-x0<260&&(p.x<305)==(x0<305));return{n:t,r:grpN||'',d:'',pg:secG,tag:tg?cl(tg.str).toLowerCase():''}}
 function finSec(){if(ent&&sec){ent.d=cl(ent.d);delete ent._hd;if(ent.tv){ent.subs=['Maggiore','Minore'].filter(k=>ent.tv[k]).map(k=>({n:'Tratto '+k,d:ent.tv[k]}))}delete ent.tv;delete ent.tl;if(ent.d)sec.items.push(ent)}if(mode==='sec')ent=null}
 function sectionFor(t){t=String(t).replace(/^\((.*)\)$/,'$1');const k='sorc:'+t.toLowerCase().replace(/[^a-zà-ú0-9]+/g,'_');if(!out.lists[k])out.lists[k]={t:t,items:[]};return out.lists[k]}
 function finStil(){if(stil){stil.d=cl(stil.d);if(stil.d||stil.r){const k='stili';if(!out.lists[k])out.lists[k]={t:'Stili di Duello',items:[]};out.lists[k].items.push({n:stil.n,r:stil.r,d:stil.d})}}stil=null}
 function body(l){ // testo di corpo
  const t=l.txt;if(!t)return;
  if(ent&&mode=='adv'){ent.d=(ent.hyOpen?ent.d:(ent.d?ent.d+' ':''))+t;ent.hyOpen=l.hy;if(l.hy)ent.d=ent.d.replace(/-$/,'')+'';}
 }
 return{
  page(items){
   const L=build(items);
   const MANN=['Fendente','Parata','Finta','Affondo','Botta','Risposta'];
   if(L.filter(l=>MANN.includes(l.txt)&&l.h>=13.5&&l.h<=14.6).length>=4){finNat();finBlk();finAdv();finStil();
    const ML=out.lists.manovre||(out.lists.manovre={t:'Manovre di Duello',items:[]});let mn=null;
    const fm=()=>{if(mn){mn.d=cl(mn.d);delete mn._hd;if(mn.d&&!ML.items.some(x=>x.n==mn.n))ML.items.push(mn)}mn=null};
    for(const l of L){if(MANN.includes(l.txt)&&l.h>=13.5&&l.h<=14.6){fm();mn={n:l.txt,d:''}}
     else if(mn&&/AJenson/i.test(l.f)&&l.h<12)addT(mn,'d',l);else if(mn&&(l.h>=17||!/AJenson/i.test(l.f)))fm()}
    fm();return}
   const pgArc=L.some(l=>/^(Virtù|Hubris)\s*:/.test(l.txt)&&l.h>=11.5);
   let prevH14=null;
   for(const l of L){
    const t=l.txt,body=/AJenson/i.test(l.f);
    const h1=isH18(l),h2=isH14(l),h3=isH12(l)||isIt(l);
    if(h1||h2){finNat();finBlk();finAdv();finStil();if(sec&&h1&&sec.items.length){finSec();sec=null}}
    if(h1&&sec){lastH1=t;continue}
    if(h1){lastH1=t;mode='';cur=null;

 return `${CAT.v?catCard():''}${CAT.v&&CAT.sv!==2?'<div class="card" style="border-color:#e0a040"><b>⚠ Catalogo vecchio.</b> Reimporta i PDF (Background e Vantaggi → Importa) per avere rune, patti e poteri divisi correttamente.</div>':''}${fltCard()}<div class="card"><h2>Stregonerie, Stili di Duello e altro</h2>${(()=>{const ord=[];c.pot.forEach((p,i)=>{const k=p.k||'Altro';if(!ord.includes(k))ord.push(k)});return ord.map(k=>`<h3>${esc(k)} <span class="chip">${c.pot.filter(p=>(p.k||'Altro')==k).length}</span></h3>`+c.pot.map((p,i)=>(p.k||'Altro')==k?`<div class="item"><div class="row">${p.cu?`<div style="flex:1">${I(`c.pot.${i}.n`,'Nome del potere')}</div>`:`<b class="wn" style="flex:1">${esc(p.n)}</b>`}${p.g&&!p.cu?`<span class="chip">${esc(p.g)}</span>`:''}</div>${p.cu?`${I(`c.pot.${i}.k`,'Stregoneria / categoria')}${T(`c.pot.${i}.d`,'Descrizione ed effetti')}`:''}<input type="text" data-p="c.pot.${i}.nota" value="${esc(p.nota||'')}" placeholder="Grado / note">${p.d&&!p.cu?`<details><summary class="mut">Descrizione</summary><p>${nl(p.d)}</p>${subsH(p)}</details>`:''}<button class="x" data-act="delpot" data-i="${i}">Rimuovi</button></div>`:'').join('')).join('')})()||'<p class="mut">Nulla di scelto.</p>'}<button class="o" data-act="addpotm">+ Potere personalizzato (nuova Stregoneria)</button></div>

 <h3>Punti Eroe e Ferite</h3><div class="mg"><div class="mb"><span>Punti Eroe</span><div class="cur"><button class="o" data-act="adj" data-p="c.ph" data-d="-1">−</button><input type="number" data-p="c.ph" value="${c.ph}"><button class="o" data-act="adj" data-p="c.ph" data-d="1">+</button></div></div>${box('Ferite',w+'/20')}${box('Drammatiche',d+'/'+(hasAdv(c,'Duro da Uccidere')?5:4))}${box('Ricchezza',c.ric)}</div>

 <h3>Vantaggi</h3>${c.adv.map(a=>{const f=advF(a.n)||{};return `<div class="mw"><b class="wn">${esc(a.n||'(senza nome)')}</b>${a.nota?' ('+esc(a.nota)+')':''}${(f.d||a.d)?`<p>${nl(f.d||a.d)}</p>`:''}</div>`}).join('')||'<p class="mut">Nessuno.</p>'}
 <h3>Arcani</h3>${v?`<div class="mw"><b class="wn">Virtù: ${esc(v.v)}</b> (${esc(v.carta)})<p>${nl(v.vd)}</p></div>`:''}${h?`<div class="mw"><b class="wn">Hubris: ${esc(h.h)}</b> (${esc(h.carta)})<p>${nl(h.hd)}</p></div>`:''}${c.cv&&c.cv.n?`<div class="mw"><b class="wn">Virtù: ${esc(c.cv.n)}</b><p>${nl(c.cv.d||'')}</p></div>`:''}${c.ch&&c.ch.n?`<div class="mw"><b class="wn">Hubris: ${esc(c.ch.n)}</b><p>${nl(c.ch.d||'')}</p></div>`:''}${!v&&!h?`<p>${esc([c.virt.n&&'Virtù: '+c.virt.n,c.hub.n&&'Hubris: '+c.hub.n].filter(Boolean).join(' · '))||'<span class="mut">Nessuno.</span>'}</p>`:''}
 ${hasSala(c)?manH(c):''}
 ${c.pot.length?'<h3>Stregoneria e Stili</h3>'+[...c.pot].sort((x,y)=>(x.k||'').localeCompare(y.k||'')).map(p=>`<div class="mw"><b class="wn">${esc(p.n||'(senza nome)')}</b> <span class="chip">${esc(p.k||'')}${p.g?' · '+esc(p.g):''}</span>${p.nota?' ('+esc(p.nota)+')':''}${p.d?`<p>${nl(p.d)}</p>${subsH(p)}`:''}</div>`).join(''):''}
 <h3>Storie</h3>${c.storie.filter(s=>s.tema||s.concl).map(s=>`<div class="mw"><b class="wn">${esc(s.tema)}</b>${s.concl?`<p><i>Conclusione:</i> ${esc(s.concl)}</p>`:''}${s.ric?`<p><i>Ricompensa:</i> ${esc(s.ric)}</p>`:''}${s.atti.map((a,j)=>`<div>${a.d?'☑':'☐'} Atto ${j+1}: ${esc(a.t)}</div>`).join('')}</div>`).join('')||'<p class="mut">Nessuna.</p>'}
 <h3>Dettagli</h3><p>${[c.ling&&'<b>Lingue:</b> '+esc(c.ling),c.soc&&'<b>Società:</b> '+esc(c.soc)+' (Favore '+c.fav+')'].filter(Boolean).join('<br>')||'<span class="mut">—</span>'}</p>
 ${c.arm.filter(a=>a.n||a.d).length?'<h3>Oggetti</h3>'+c.arm.filter(a=>a.n||a.d).map(a=>`<div class="mw"><b class="wn">${esc(a.n)}</b>${a.d?`<p>${nl(a.d)}</p>`:''}</div>`).join(''):''}${c.nave?`<h3>Nave</h3><p>${nl(c.nave)}</p>`:''}</div>`}
// ---------- Malvagi (GM) ----------
let gmt='gen',gv=-1,vsec='Profilo',vls='';
const VSEC=['Profilo','Vantaggi','Arcani','Stregoneria e Duello','Macchinazioni','Mostro','Riepilogo'];
const QMN=['Acquatico','Alato','Chitinoso','Elementale','Evanescente','Inarrestabile','Mutaforma','Non Morto','Notturno','Possente','Rapido','Rigenerante','Teletrasportante','Tentacolare','Terrificante','Velenoso'];
const vdef=()=>({nome:'',desc:'',mostro:0,forza:5,infl:5,w:0,d:0,virt:{n:'',carta:''},hub:{n:'',carta:''},cv:{n:'',d:''},ch:{n:'',d:''},adv:[],pot:[],qm:[],mac:[],note:''});
const vfix=V=>Object.assign(vdef(),V);
const vn=x=>Math.max(0,Math.floor(+x||0));
const VP=k=>'gm.vill.'+gv+'.'+k;
function vcalc(V){const F=Math.max(1,vn(V.forza)),I=vn(V.infl),inv=(V.mac||[]).filter(m=>(m.st||'a')=='a').reduce((a,m)=>a+vn(m.inv),0),disp=Math.max(0,I-inv);
 return{F,I,inv,disp,mal:F+I,dadi:F+disp,gr:Math.ceil(F/2),bud:5+F,sp:(V.adv||[]).reduce((a,x)=>a+(+x.c||0),0),tot:4*(F+1),sub:vn(V.d)*(F+1)+vn(V.w)}}
function vdmg(V,n){const F=Math.max(1,vn(V.forza));V.w=vn(V.w)+n;V.d=vn(V.d);while(V.w>F&&V.d<4){V.w-=F+1;V.d++}if(V.d>=4)V.w=0}
const vhasDuel=V=>hasSala(V)||V.pot.some(p=>p.k=='Stili di Duello');
const vstep=(l,k,mn)=>`<div class="mb"><span>${l}</span><div class="cur"><button class="o" data-act="vl_adj" data-k="${k}" data-min="${mn}" data-d="-1">−</button><input type="number" data-p="${VP(k)}" data-rcc data-min="${mn}" value="${vn(S.gm.vill[gv][k])}" style="width:62px;text-align:center"><button class="o" data-act="vl_adj" data-k="${k}" data-min="${mn}" data-d="1">+</button></div></div>`;
function vHead(V){const x=vcalc(V),dead=V.d>=4;
 return `<div class="card"><div class="row"><div style="flex:1">${I(VP('nome'),'Nome del Malvagio')}</div><button class="o" data-act="vl_back">← Elenco</button></div>
 <div class="g2" style="margin-top:8px">${vstep('Forza','forza',1)}${vstep('Influenza','infl',0)}</div><div class="mg" style="margin-top:8px"><div class="mb"><span>Malvagità</span><b>${x.mal}</b><i>Forza + Influenza</i></div><div class="mb"><span>Dadi max per Rischio</span><b>${x.dadi}</b><i>${x.inv?x.inv+' Influenza investita':'Forza + Influenza'}</i></div><div class="mb"><span>Grado per Abilità/Tratti</span><b>${x.gr}</b><i>metà Forza, per eccesso</i></div></div>
 <h3>Ferite</h3><div class="mg"><div class="mb"><span>Ferite in questa sezione</span><b>${vn(V.w)}/${x.F}</b><i>la ${x.F+1}ª è Drammatica</i></div><div class="mb"><span>Ferite Drammatiche</span><b>${'★'.repeat(vn(V.d))}${'☆'.repeat(4-vn(V.d))}</b><i>4 = Inerme</i></div><div class="mb"><span>Totale subito</span><b>${x.sub}/${x.tot}</b></div></div>
 <div class="row" style="margin-top:6px"><button class="o" data-act="vl_dmg" data-d="1">+1</button><button class="o" data-act="vl_dmg" data-d="3">+3</button><button class="o" data-act="vl_dmg" data-d="5">+5</button><input id="vdn" type="number" value="1" min="1" style="width:70px"><button data-act="vl_dmgn">Infliggi</button><button class="o" data-act="vl_heal" data-d="1">−1 Ferita</button><button class="o" data-act="vl_dr" data-d="-1">−1 ★</button><button class="x" data-act="vl_clr">Azzera</button></div>
 ${dead?'<div class="crisi" style="margin-top:6px">INERME — Malvagio sconfitto</div>':''}
 <div class="row" style="margin-top:8px;align-items:center"><b>Punti Pericolo del GM</b><div class="cur"><button class="o" data-act="adj" data-p="gm.pp" data-d="-1">−</button><input type="number" data-p="gm.pp" value="${S.gm.pp}"><button class="o" data-act="adj" data-p="gm.pp" data-d="1">+</button></div></div>
 <p class="hint">Pressione Malvagia: 1 Incremento + 1 Punto Pericolo applicano la stessa Pressione a tutti gli Eroi in Scena (superabile con 1 Incremento in più).</p></div>`}
function vNav(V){return '<div class="row" style="gap:6px;margin:6px 0;overflow-x:auto;flex-wrap:nowrap">'+VSEC.filter(s=>s!='Mostro'||V.mostro).map(s=>`<button class="tab ${s==vsec?'on':''}" style="white-space:nowrap;flex:none" data-act="vl_sec" data-k="${s}">${s}</button>`).join('')+'</div>'}
function vProf(V){return `<div class="card"><h2>Profilo</h2>${T(VP('desc'),'Descrizione, aspetto, obiettivi')}<label class="pill" style="margin-top:8px"><input type="checkbox" data-p="${VP('mostro')}" data-rcc ${V.mostro?'checked':''}> Mostro (abilita la scheda Qualità Mostruose)</label>${T(VP('note'),'Note del GM')}</div>
 <div class="card"><h2>Regole in breve</h2><p class="hint">Un Malvagio ha solo due Tratti, Forza e Influenza, la cui somma è la Malvagità (Debole ≈5, Forte ≈10, Epico ≈15, Leggendario ≈20). In un Rischio lancia un numero di dadi a discrezione del GM, pari o inferiore alla Malvagità (l’Influenza investita in Macchinazioni non è utilizzabile), senza dichiarare un Approccio e senza penalità di Improvvisazione. Gli Eroi riducono l’Influenza con Azioni indirette; la Forza si abbatte solo affrontandolo di persona. Vantaggi: 5 + Forza punti. Dove servirebbe un’Abilità o un Tratto (Vantaggi, Stregonerie, Stili, Manovre) si usa metà Forza per eccesso. Ferite: prima di una Drammatica serve un numero di Ferite pari alla Forza; con 4 Drammatiche è Inerme.</p></div>`}
function vAdv(V){const x=vcalc(V);
 return `<div class="card"><h2>Vantaggi</h2><p class="hint">Punti spesi: <b>${x.sp}</b> / ${x.bud} (5 + Forza).${x.sp>x.bud?' <span class="crisi">Oltre il limite!</span>':''}</p>`+V.adv.map((a,i)=>{const f=advF(a.n)||{};return `<div class="item"><div class="row">${a.cu?`<div style="flex:1">${I(VP('adv.'+i+'.n'),'Nome del Vantaggio')}</div>`:`<b class="wn" style="flex:1">${esc(a.n)}</b>`}<div style="width:70px"><label>Costo</label><input type="number" data-p="${VP('adv.'+i+'.c')}" data-rcc data-min="0" value="${vn(a.c)}"></div></div><input type="text" data-p="${VP('adv.'+i+'.nota')}" value="${esc(a.nota||'')}" placeholder="Note">${a.cu?T(VP('adv.'+i+'.d'),'Descrizione ed effetti'):''}${f.d?`<details><summary class="mut">Descrizione</summary><p>${nl(f.d)}</p></details>`:''}<button class="x" data-act="vl_deladv" data-i="${i}">Rimuovi</button></div>`}).join('')+`<button class="o" data-act="vl_advm">+ Vantaggio personalizzato</button></div>`

 return `<div class="card"><div class="row"><button data-act="vl_sqnew">+ Nuova Squadra</button><span class="mut">${S.gm.sq.length} salvate</span></div><p class="hint">Una Squadra ha un solo Tratto, la Forza (numero di persone). Ogni Incremento degli Eroi la riduce di 1; nel suo turno infligge Ferite pari alla Forza attuale a un solo Eroe. Se non è a zero può continuare l’assalto, riorganizzarsi (unirsi o dividersi) o arrendersi. Impiegarne una costa 1 Influenza ogni 10 punti di Forza.</p></div>`

  return `<div class="card"><div class="row"><div style="flex:1">${I(SP(i,'nome'),'Nome della Squadra')}</div><button class="x" data-act="vl_sqdel" data-i="${i}">Elimina</button></div>
  <div class="mg" style="margin-top:8px"><div class="mb"><span>Forza attuale</span><div class="cur"><button class="o" data-act="vl_sqadj" data-i="${i}" data-d="-1">−</button><input type="number" style="width:56px;text-align:center" data-p="${SP(i,'forza')}" data-rcc data-min="0" value="${F}"><button class="o" data-act="vl_sqadj" data-i="${i}" data-d="1">+</button></div><i>Ferite inflitte per attacco: ${F}</i></div><div class="mb"><span>Forza iniziale</span><input type="number" style="width:70px;text-align:center" data-p="${SP(i,'max')}" data-rcc data-min="1" value="${M}"></div></div>
  ${F==0?'<div class="crisi">SCONFITTA</div>':''}
  <div class="row" style="margin-top:6px"><button class="o" data-act="vl_sqfull" data-i="${i}">Ripristina Forza</button><button class="o" data-act="vl_sqsplit" data-i="${i}">Dividi a metà</button>${others.length?`<select data-sqm="${i}"><option value="">Unisci con…</option>${others.map(([o,k])=>`<option value="${k}">${esc(o.nome||'Squadra '+(k+1))} (Forza ${vn(o.forza)})</option>`).join('')}</select>`:''}</div>
  <label style="margin-top:8px">Tipo</label><select data-p="${SP(i,'tipo')}" data-rcc>${Object.keys(SQT).map(k=>`<option value="${k}" ${k==q.tipo?'selected':''}>${k||'Nessuno'}</option>`).join('')}</select>
  ${q.tipo?`<div class="hint">${esc(SQT[q.tipo])}</div><div class="row"><button class="o" data-act="vl_sqcap" data-i="${i}">Usa Capacità (−1 Punto Pericolo${/Pirati|Ladri/.test(q.tipo)?', −1 Forza':''})</button><span class="mut">Punti Pericolo GM: <b>${S.gm.pp}</b></span></div>`:''}
  <label class="pill" style="margin-top:8px"><input type="checkbox" data-p="${SP(i,'mostro')}" data-rcc ${q.mostro?'checked':''}> Squadra di Mostri (Qualità Mostruose al posto del Tipo)</label>
  ${q.mostro?`${q.qm.map((m,k)=>`<div class="item">${I(SP(i,'qm.'+k+'.n'),'Qualità')}${T(SP(i,'qm.'+k+'.d'),'Effetto')}<div class="row">${/Non Morto/i.test(m.n)?`<button class="o" data-act="vl_sqnm" data-i="${i}">Ripristina piena Forza (−1 PP, fine Round)</button>`:''}<button class="x" data-act="vl_sqdelq" data-i="${i}" data-j="${k}">Rimuovi</button></div></div>`).join('')}<select data-sqq="${i}"><option value="">+ Aggiungi Qualità…</option>${QMN.map(n=>`<option>${n}</option>`).join('')}<option value="__">Personalizzata</option></select><div class="hint">Di solito una o due Qualità per Squadra. Scrivi l’effetto dal tuo Manuale Base (pag. 197-198).</div>`:''}
  ${T(SP(i,'note'),'Note')}</div>`}).join('')}
function gmGen(){const g=S.gm;return `<div class="card"><h2>Riserva di Pericolo</h2><div class="cur" style="justify-content:center"><button class="o" data-act="adj" data-p="gm.pp" data-d="-1">−</button><input type="number" data-p="gm.pp" value="${g.pp}" style="width:90px;font-size:22px"><button class="o" data-act="adj" data-p="gm.pp" data-d="1">+</button></div><p class="hint">All'inizio di ogni sessione il GM ha 1 Punto Pericolo per ogni Eroe (${S.chars.length} salvati).</p><div class="row" style="justify-content:center"><button class="o" data-act="ppreset">Imposta = numero di Eroi</button></div></div>
 <div class="card"><h2>Storie del GM</h2>${g.storie.map((s,i)=>`<div class="item">${I(`gm.storie.${i}.t`,'Titolo')}${T(`gm.storie.${i}.c`,'Conclusione e ricompensa')}<label style="margin-top:6px">Atti</label>${s.atti.map((a,j)=>`<div class="row" style="margin-top:4px"><label class="pill"><input type="checkbox" data-p="gm.storie.${i}.atti.${j}.d" ${a.d?'checked':''}> ${j+1}</label><input type="text" style="flex:1" data-p="gm.storie.${i}.atti.${j}.t" value="${esc(a.t)}"><button class="x" data-act="gdelatto" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><button class="o" data-act="gaddatto" data-i="${i}">+ Atto</button><button class="x" data-act="gdelst" data-i="${i}">Rimuovi</button></div></div>`).join('')}<button class="o" data-act="gaddst">+ Nuova Storia del GM</button></div>
 <div class="card"><h2>Note del GM</h2>${T('gm.note','Malvagi, Squadre di Sgherri, segreti…')}</div>`}
function doImport(rep){const el=document.getElementById('bk');try{const j=JSON.parse(el.value.trim());if(!j||!Array.isArray(j.chars))throw 0;
 const ch=j.chars.map(c=>Object.assign(JSON.parse(JSON.stringify(def().c)),c));
 if(rep){if(!confirm('Sostituire tutti gli Eroi attuali?'))return false;S.chars=ch;if(j.gm)S.gm=j.gm;S.cur=null;S.c=null}
 else{S.chars.push(...ch)}
 alert('Importati '+ch.length+' eroi');return true}catch(x){alert('Testo non valido: incolla il codice esportato dall\'app.');return false}}
function home(){const n=S.chars.length;return `<div class="card"><div class="row"><button data-act="new">+ Nuovo Eroe</button><span class="mut">${n} ${n==1?'eroe':'eroi'}</span></div></div><div class="g2">`+S.chars.map((c,i)=>`<div class="card"><div data-act="open" data-i="${i}" style="cursor:pointer"><div class="big" style="font-size:20px">${esc(c.nome||'Senza nome')}</div><div class="mut">${esc([c.naz,c.fama].filter(Boolean).join(' · '))||'—'}</div><p>Ferite <b>${wnd(c)}</b> · ★ <b>${drm(c)}</b> · Punti Eroe <b>${c.ph}</b></p></div><div class="row"><button data-act="open" data-i="${i}">Apri</button><button class="o" data-act="dup" data-i="${i}">Duplica</button><button class="x" data-act="chdel" data-i="${i}">Elimina</button></div></div>`).join('')+`</div>`+(n?'':'<p class="mut">Nessun Eroe: creane uno per iniziare.</p>')+`<div class="card" style="margin-top:12px"><h2>Backup e trasferimento</h2><p class="mut">Esporta per ottenere un codice con tutti gli Eroi, poi incollalo su un altro dispositivo e importa.</p><div class="row"><button data-act="exp">Esporta</button><button class="o" data-act="copy">Copia</button></div><textarea id="bk" placeholder="Qui compare il codice esportato. Per importare, incollalo qui." style="margin-top:8px;min-height:90px"></textarea><div class="row" style="margin-top:6px"><button class="o" data-act="imp">Importa (aggiungi)</button><button class="x" data-act="impr">Importa (sostituisci tutto)</button></div></div>`}
function render(){if((tab=='sheet'||tab=='riep')&&!S.c)tab='home';const A=document.getElementById('app');A.innerHTML=tab=='home'?home():tab=='sheet'?SECS[sec]():tab=='riep'?riep():gm();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));
 document.getElementById('nav').innerHTML=tab=='sheet'?SEC.map((n,i)=>`<button class="tab ${i==sec?'on':''}" data-act="s" data-i="${i}">${i+1}. ${n}</button>`).join(''):'';
 document.getElementById('fpbar').style.display=S.c&&tab!='home'&&tab!='gm'?'flex':'none';document.getElementById('fpbar').innerHTML=`<b>⭐ Punti Eroe · ${S.c?esc(S.c.nome||'Senza nome'):''}</b><button class="o" data-act="adj" data-p="c.ph" data-d="-1">−</button><input type="number" data-p="c.ph" value="${S.c?S.c.ph:0}"><button class="o" data-act="adj" data-p="c.ph" data-d="1">+</button>`;
 save()}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;
 if(t.id=='flt'){FLT=t.value.trim().toLowerCase();document.querySelectorAll('.mw[data-n]').forEach(r=>{r.style.display=!FLT||r.dataset.n.includes(FLT)?'':'none'});return}
 if(!p)return;
 put(p,t.type=='checkbox'?(t.checked?1:0):(t.type=='number')?Number(t.value)||0:t.value);
 if(p=='c.ph'){document.querySelectorAll('input[data-p="c.ph"]').forEach(x=>{if(x!==t)x.value=t.value})}
 if(t.dataset.rc!==undefined){render();return}save()});
document.addEventListener('change',e=>{const t=e.target;
 if(vchange(t))return;
 if(t.id=='bgn'){bgSel=t.value;render();return}if(t.id=='advc'){advC=t.value;render();return}if(t.id=='lsc'){lsSel=t.value;render();return}
 if(t.id=='virt'||t.id=='hub'){const a=CAT.arc[+t.value],k=t.id;if(a){S.c[k]=k=='virt'?{n:a.v,carta:a.carta}:{n:a.h,carta:a.carta}}else S.c[k]={n:'',carta:''};render();return}
 if(t.id=='pdf'&&t.files.length)importPdf([...t.files])});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;e.preventDefault();const a=t.dataset.act,i=+t.dataset.i,j=+t.dataset.j,d=+t.dataset.d,c=S.c;
 const bk=document.getElementById('bk'),dump=()=>JSON.stringify({ss:1,chars:S.chars,gm:S.gm});
 if(a=='exp'){bk.value=dump();bk.focus();bk.select();return}
 if(a=='copy'){if(!bk.value)bk.value=dump();bk.select();try{navigator.clipboard.writeText(bk.value)}catch(x){}try{document.execCommand('copy')}catch(x){}alert('Codice copiato');return}
 if(a=='imp'||a=='impr'){if(!doImport(a=='impr'))return}
 else if(a=='tab')tab=(t.dataset.v!='home'&&t.dataset.v!='gm'&&!S.c)?'home':t.dataset.v;
 else if(a=='new'){S.chars.push(def().c);S.cur=S.chars.length-1;S.c=S.chars[S.cur];tab='sheet';sec=0}
 else if(a=='open'){S.cur=i;S.c=S.chars[i];tab='sheet';sec=0}
 else if(a=='dup'){const n=JSON.parse(JSON.stringify(S.chars[i]));n.nome=(n.nome||'Senza nome')+' (copia)';S.chars.push(n)}
 else if(a=='chdel'){if(!confirm('Eliminare questo Eroe?'))return;S.chars.splice(i,1);if(S.cur===i){S.cur=null;S.c=null}else if(S.cur>i)S.cur--}
 else if(a=='s'){sec=i;tab='sheet'}
 else if(a=='adj')put(t.dataset.p,Math.max(0,(Number(get(t.dataset.p))||0)+d));
 else if(a=='dot'){const ty=t.dataset.t,k=t.dataset.k,v=+t.dataset.v;let cu=ty=='tr'?c.tr[k]:ty=='ab'?(c.ab[k]||0):(+c.abx[k].v||0);const mn=ty=='tr'?2:0;let nv=v===cu?v-1:v;nv=Math.min(5,Math.max(mn,nv));if(ty=='tr')c.tr[k]=nv;else if(ty=='ab')c.ab[k]=nv;else c.abx[k].v=nv}
 else if(a=='tr'){const k=t.dataset.k;c.tr[k]=Math.min(5,Math.max(2,c.tr[k]+d))}
 else if(a=='sk'){const k=t.dataset.k;c.ab[k]=Math.min(5,Math.max(0,(c.ab[k]||0)+d))}
 else if(a=='fer'){c.fer=c.fer.slice();if(c.fer[i]){for(let k=i;k<20;k++)c.fer[k]=0}else{for(let k=0;k<=i;k++)c.fer[k]=1}}
 else if(a=='ferclr')c.fer=Array(20).fill(0);
 else if(a=='addbg'){const b=CAT.bg[i];applyBg(c,b)}
 else if(a=='addbgm')c.bg.push({n:'',naz:'',pec:'',d:'',cu:1});
 else if(a=='delbg')c.bg.splice(i,1);
 else if(a=='addadv'){const x=CAT.adv[i];c.adv.push({n:x.n,c:x.c,src:'acq',nota:''})}
 else if(a=='addadvm')c.adv.push({n:'',c:1,src:'acq',nota:'',d:'',cu:1});
 else if(a=='deladv')c.adv.splice(i,1);
 else if(a=='addstoria')c.storie.push({tema:'',concl:'',ric:'',atti:[{t:'',d:0}]});
 else if(a=='delstoria')c.storie.splice(i,1);
 else if(a=='addatto')c.storie[i].atti.push({t:'',d:0});
 else if(a=='delatto')c.storie[i].atti.splice(j,1);
 else if(a=='addpot'){const L=CAT.lists[lsSel],it=L.items[j],x=c.pot.findIndex(p=>p.n==it.n&&p.k==L.t);if(x>=0)c.pot.splice(x,1);else c.pot.push({n:it.n,k:L.t,g:it.g||'',d:it.d,subs:it.subs||[],nota:''})}
 else if(a=='addpotm')c.pot.push({n:'',k:'',d:'',nota:'',cu:1});
 else if(a=='addpotc'){const L=CAT.lists[lsSel];c.pot.push({n:'',k:L.t,g:'Personalizzato',d:'',nota:'',cu:1})}
 else if(a=='addabx')(c.abx=c.abx||[]).push({n:'',v:0,d:''});
 else if(a=='delabx')c.abx.splice(i,1);
 else if(a=='delpot')c.pot.splice(i,1);
 else if(a=='addarm')c.arm.push({n:'',d:''});
 else if(a=='delarm')c.arm.splice(i,1);
 else if(a=='ppreset')S.gm.pp=S.chars.length;
 else if(a=='gaddst')S.gm.storie.push({t:'',c:'',atti:[{t:'',d:0}]});
 else if(a=='gdelst')S.gm.storie.splice(i,1);
 else if(a=='gaddatto')S.gm.storie[i].atti.push({t:'',d:0});
 else if(a=='gdelatto')S.gm.storie[i].atti.splice(j,1);
 else if(a.startsWith('vl_'))vclick(a,t,i,j,d);
 else if(a=='clrcat'){if(confirm('Cancellare il catalogo importato?')){CAT={v:0,bg:[],adv:[],arc:[],nat:{},lists:{}};localStorage.removeItem(CK)}else return}
 else if(a=='reset'){if(confirm('Azzerare questa scheda?')){S.chars[S.cur]=def().c;S.c=S.chars[S.cur]}else return}
 render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
